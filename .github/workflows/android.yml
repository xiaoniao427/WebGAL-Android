name: Android Native Build - v8 and v7

on:
  push:
    branches:
      - main
    paths:
      - '**/*.cpp'
      - '**/*.c'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '**/Android.mk'
      - '**/Application.mk'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: false
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      abi:
        description: '目标架构'
        required: false
        default: 'both'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - both
      java_version:
        description: 'Java版本'
        required: false
        default: '21'
        type: string
      ndk_version:
        description: 'Android NDK版本'
        required: false
        default: '25.2.9519653'
        type: string

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_TOOL_OPTIONS: -Xmx4G

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      abi_list: ${{ steps.set-abis.outputs.abi_list }}
    steps:
      - name: Determine ABI list
        id: set-abis
        run: |
          if [ "${{ github.event.inputs.abi || 'both' }}" = "both" ]; then
            echo "abi_list=[\"arm64-v8a\", \"armeabi-v7a\"]" >> $GITHUB_OUTPUT
          else
            echo "abi_list=[\"${{ github.event.inputs.abi || 'arm64-v8a' }}\"]" >> $GITHUB_OUTPUT
          fi
          echo "Selected ABIs: ${{ steps.set-abis.outputs.abi_list }}"

  find-cmake:
    runs-on: ubuntu-latest
    outputs:
      cmake_dir: ${{ steps.find-cmake-file.outputs.cmake_dir }}
      has_cmake: ${{ steps.find-cmake-file.outputs.has_cmake }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Find CMakeLists.txt
        id: find-cmake-file
        run: |
          # 查找项目中所有的 CMakeLists.txt 文件
          echo "Searching for CMakeLists.txt files..."
          find . -name "CMakeLists.txt" -type f | head -10
          
          # 检查常见的 Android 原生代码位置
          if [ -f "./app/src/main/cpp/CMakeLists.txt" ]; then
            echo "Found CMakeLists.txt in app/src/main/cpp/"
            echo "cmake_dir=./app/src/main/cpp" >> $GITHUB_OUTPUT
            echo "has_cmake=true" >> $GITHUB_OUTPUT
          elif [ -f "./src/main/cpp/CMakeLists.txt" ]; then
            echo "Found CMakeLists.txt in src/main/cpp/"
            echo "cmake_dir=./src/main/cpp" >> $GITHUB_OUTPUT
            echo "has_cmake=true" >> $GITHUB_OUTPUT
          elif [ -f "./CMakeLists.txt" ]; then
            echo "Found CMakeLists.txt in root directory"
            echo "cmake_dir=./" >> $GITHUB_OUTPUT
            echo "has_cmake=true" >> $GITHUB_OUTPUT
          else
            echo "No CMakeLists.txt found"
            echo "has_cmake=false" >> $GITHUB_OUTPUT
          fi

  build-native:
    needs: [setup, find-cmake]
    if: needs.find-cmake.outputs.has_cmake == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: ${{ fromJSON(needs.setup.outputs.abi_list) }}
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
      NDK_VERSION: ${{ github.event.inputs.ndk_version || '25.2.9519653' }}
      ANDROID_PLATFORM: android-24
      CMAKE_DIR: ${{ needs.find-cmake.outputs.cmake_dir || '.' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ github.event.inputs.java_version || '21' }}

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: ${{ env.NDK_VERSION }}

    - name: Setup build environment
      id: setup-env
      run: |
        # 设置 NDK 路径
        ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}"
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
        
        echo "Building for ABI: ${{ matrix.abi }}"
        echo "Build type: ${{ env.BUILD_TYPE }}"
        echo "CMake directory: ${{ env.CMAKE_DIR }}"
        echo "NDK version: ${{ env.NDK_VERSION }}"

    - name: Create build directory
      run: |
        mkdir -p build/android/${{ matrix.abi }}
        echo "Build directory created at: build/android/${{ matrix.abi }}"

    - name: Check if CMakeLists.txt exists
      run: |
        echo "Checking for CMakeLists.txt in: ${{ env.CMAKE_DIR }}"
        if [ -f "${{ env.CMAKE_DIR }}/CMakeLists.txt" ]; then
          echo "✅ CMakeLists.txt found"
          ls -la "${{ env.CMAKE_DIR }}/"
        else
          echo "❌ CMakeLists.txt not found in ${{ env.CMAKE_DIR }}"
          echo "Available files:"
          ls -la "${{ env.CMAKE_DIR }}/" || true
          exit 1
        fi

    - name: Configure CMake for Android
      working-directory: build/android/${{ matrix.abi }}
      run: |
        echo "Current directory: $(pwd)"
        echo "Source directory: ${{ env.CMAKE_DIR }}"
        
        # 使用绝对路径
        SOURCE_DIR="$GITHUB_WORKSPACE/${{ env.CMAKE_DIR }}"
        echo "Absolute source directory: $SOURCE_DIR"
        
        # 检查 CMakeLists.txt
        if [ ! -f "$SOURCE_DIR/CMakeLists.txt" ]; then
          echo "Error: CMakeLists.txt not found at $SOURCE_DIR/CMakeLists.txt"
          exit 1
        fi
        
        cmake "$SOURCE_DIR" \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=${{ env.ANDROID_PLATFORM }} \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DANDROID_STL=c++_shared \
          -DANDROID_TOOLCHAIN=clang \
          -DANDROID_CPP_FEATURES="rtti exceptions"

    - name: Build native libraries
      working-directory: build/android/${{ matrix.abi }}
      run: |
        echo "Building native libraries for ${{ matrix.abi }}..."
        nproc=$(nproc)
        echo "Using $nproc parallel jobs"
        make -j$nproc VERBOSE=1

    - name: List built libraries
      run: |
        echo "Built files for ${{ matrix.abi }}:"
        find build/android/${{ matrix.abi }} -name "*.so" -o -name "*.a" | xargs ls -lh 2>/dev/null || echo "No libraries found"

    - name: Archive built libraries
      uses: actions/upload-artifact@v4
      with:
        name: native-libs-${{ matrix.abi }}-${{ env.BUILD_TYPE }}
        path: |
          build/android/${{ matrix.abi }}/**/*.so
          build/android/${{ matrix.abi }}/**/*.a
        retention-days: 30

    - name: Create stripped libraries (Release only)
      if: env.BUILD_TYPE == 'Release'
      run: |
        echo "Creating stripped libraries for ${{ matrix.abi }}..."
        find build/android/${{ matrix.abi }} -name "*.so" | while read lib; do
          echo "Stripping $lib"
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-all "$lib"
        done 2>/dev/null || echo "No libraries to strip"

    - name: Verify library architecture
      run: |
        echo "Verifying library architecture for ${{ matrix.abi }}..."
        find build/android/${{ matrix.abi }} -name "*.so" | while read lib; do
          echo "File: $lib"
          file "$lib" || true
          echo "---"
        done 2>/dev/null || echo "No libraries found for verification"

  build-apk-with-native:
    needs: [setup, build-native]
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ github.event.inputs.java_version || '21' }}
        cache: gradle

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: ${{ github.event.inputs.ndk_version || '25.2.9519653' }}

    - name: Download built native libraries
      uses: actions/download-artifact@v4
      with:
        path: downloaded-libs

    - name: Copy native libraries to jniLibs
      run: |
        echo "Copying native libraries to jniLibs directory..."
        mkdir -p app/src/main/jniLibs
        
        # 遍历下载的库文件
        for artifact in downloaded-libs/*; do
          if [ -d "$artifact" ]; then
            artifact_name=$(basename "$artifact")
            if [[ "$artifact_name" =~ native-libs-(arm64-v8a|armeabi-v7a)- ]]; then
              abi_type=$(echo "$artifact_name" | grep -oE '(arm64-v8a|armeabi-v7a)')
              echo "Copying $abi_type libraries..."
              mkdir -p "app/src/main/jniLibs/$abi_type"
              find "$artifact" -name "*.so" -exec cp {} "app/src/main/jniLibs/$abi_type/" \; 2>/dev/null || true
            fi
          fi
        done
        
        echo "jniLibs structure:"
        find app/src/main/jniLibs -type f | sort || echo "No jniLibs files found"

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK with native libraries
      run: |
        echo "Building APK with native libraries..."
        
        if [ "${{ env.BUILD_TYPE }}" = "Debug" ]; then
          ./gradlew clean assembleDebug --stacktrace
        else
          ./gradlew clean assembleRelease --stacktrace
        fi

    - name: Verify APK exists
      run: |
        if [ "${{ env.BUILD_TYPE }}" = "Debug" ]; then
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        else
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
        fi
        
        if [ -f "$APK_PATH" ]; then
          echo "✅ APK built successfully: $APK_PATH"
          echo "APK size: $(du -h "$APK_PATH" | cut -f1)"
          # 检查 APK 是否包含原生库
          echo "Checking for native libraries in APK..."
          unzip -l "$APK_PATH" | grep "\.so" | head -10 || echo "No .so files found in APK"
        else
          echo "❌ APK not found at: $APK_PATH"
          echo "Available APK files:"
          find app/build -name "*.apk" -type f 2>/dev/null || true
          exit 1
        fi

    - name: Rename and upload APK
      run: |
        if [ "${{ env.BUILD_TYPE }}" = "Debug" ]; then
          cp app/build/outputs/apk/debug/app-debug.apk webgal-with-native-${{ github.sha_short }}-debug.apk
          APK_NAME="webgal-with-native-debug.apk"
        else
          cp app/build/outputs/apk/release/app-release-unsigned.apk webgal-with-native-${{ github.sha_short }}-release.apk
          APK_NAME="webgal-with-native-release.apk"
        fi
        
        echo "Renamed APK to: $APK_NAME"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BUILD_TYPE }}-apk-with-native
        path: webgal-with-native-*.apk
        retention-days: 30

  create-release:
    needs: [build-apk-with-native, build-native]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ github.event.inputs.build_type || 'Release' }}-apk-with-native
        path: release-apk

    - name: Download native libraries
      uses: actions/download-artifact@v4
      with:
        path: release-libs
        pattern: native-libs-*

    - name: Create version tag
      id: create_tag
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }}
        echo "TAG_NAME=native-v${TIMESTAMP}-${BUILD_TYPE}-${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "RELEASE_NAME=WebGAL Android with Native ${TIMESTAMP} (${BUILD_TYPE})" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.create_tag.outputs.TAG_NAME }}
        name: ${{ steps.create_tag.outputs.RELEASE_NAME }}
        draft: false
        prerelease: false
        files: |
          release-apk/*.apk
          release-libs/**/*.so
        body: |
          ## WebGAL Android with Native Libraries 构建
          
          **构建信息：**
          - 构建时间：$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - Commit: ${{ github.sha }}
          - 触发方式：${{ github.event_name }}
          - 构建类型：${{ github.event.inputs.build_type || 'Release' }}
          
          **包含内容：**
          - APK 文件（已包含原生库）
          - 单独的原生库文件 (.so)
          
          **支持的架构：**
          ${{ fromJSON(needs.setup.outputs.abi_list) }}
          
          **使用说明：**
          1. APK 文件可直接安装使用
          2. 原生库文件可用于其他项目集成

    - name: Build summary
      run: |
        echo "========================================"
        echo "          🎉 Android 原生构建完成！"
        echo "========================================"
        echo ""
        echo "📋 构建详情："
        echo "----------------------------------------"
        echo "🏗️  构建类型: ${{ github.event.inputs.build_type || 'Release' }}"
        echo "📱 目标架构: ${{ fromJSON(needs.setup.outputs.abi_list) }}"
        echo "☕ Java版本: ${{ github.event.inputs.java_version || '21' }}"
        echo "🛠️  NDK版本: ${{ github.event.inputs.ndk_version || '25.2.9519653' }}"
        echo ""
        echo "✅ 构建结果："
        echo "----------------------------------------"
        echo "- Native Libraries: ✅ 已构建"
        echo "- APK with Native: ✅ 已构建"
        echo "- Release: ✅ 已创建"
        echo "- Tag: ${{ steps.create_tag.outputs.TAG_NAME }}"
        echo ""
        echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.create_tag.outputs.TAG_NAME }}"
        echo "========================================"

  no-cmake-found:
    needs: find-cmake
    if: needs.find-cmake.outputs.has_cmake == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: No CMakeLists.txt found
        run: |
          echo "❌ 未找到 CMakeLists.txt 文件"
          echo ""
          echo "您的项目需要包含 CMakeLists.txt 文件才能构建原生库。"
          echo ""
          echo "请检查以下位置："
          echo "1. 项目根目录"
          echo "2. app/src/main/cpp/"
          echo "3. src/main/cpp/"
          echo ""
          echo "如果没有 CMakeLists.txt，您需要："
          echo "1. 创建原生代码目录结构"
          echo "2. 编写 CMakeLists.txt"
          echo "3. 配置 build.gradle 使用 CMake"
          exit 1